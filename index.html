<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NAUKA — Discover Beautiful Boats &amp; Waterway Experiences</title>
  <meta name="description" content="NAUKA is launching soon at nauka.co.in. Discover beautiful boats and memorable experiences on India's waterways. Join the waitlist for early access.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nauka.co.in/">
  <meta property="og:title" content="NAUKA — Your Next Escape Begins on the Water">
  <meta property="og:description" content="Discover beautiful boats and memorable experiences with NAUKA. Launching soon — join the waitlist.">
  <meta property="og:image" content="https://nauka.co.in/assets/hero.jpg">
  <meta property="og:site_name" content="NAUKA">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NAUKA — Your Next Escape Begins on the Water">
  <meta name="twitter:description" content="Discover beautiful boats and memorable experiences with NAUKA. Launching soon — join the waitlist.">
  <meta name="twitter:image" content="https://nauka.co.in/assets/hero.jpg">

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background image (blurred via CSS) -->
  <div class="bg" role="img" aria-label="A traditional houseboat on calm backwaters at golden hour"></div>

  <!-- ─── Main card ─── -->
  <main class="page">
    <section class="card" aria-label="Coming soon">

      <!-- Wordmark -->
      <header class="card__header">
        <a href="/" class="wordmark" aria-label="NAUKA home">nauka</a>
      </header>

      <!-- Copy -->
      <span class="badge" id="badge-launching">Launching soon</span>

      <h1 class="headline">Your next escape<br>begins on the water.</h1>

      <p class="subtext">
        Discover beautiful boats and memorable experiences with NAUKA.
        Join our list to hear when we launch.
      </p>

      <!-- Email signup form -->
      <form id="signup-form" class="signup" novalidate aria-label="Email waitlist signup">
        <div class="signup__row">
          <label for="email-input" class="sr-only">Email address</label>
          <input
            id="email-input"
            type="email"
            name="email"
            class="signup__input"
            placeholder="Please enter your e-mail address"
            autocomplete="email"
            required
            aria-describedby="signup-status consent-text"
          >
          <button id="signup-btn" type="submit" class="signup__btn">
            <span class="signup__btn-label">Subscribe</span>
            <span class="signup__btn-spinner" aria-hidden="true"></span>
          </button>
        </div>

        <!-- Status messages -->
        <div id="signup-status" class="signup__status" role="status" aria-live="polite"></div>
      </form>

      <!-- Consent -->
      <p id="consent-text" class="consent">
        By subscribing, you agree to receive NAUKA's launch announcement.
      </p>

      <!-- Social & Contact Links -->
      <nav class="card__socials" aria-label="Connect with NAUKA">
        <a
          href="https://www.instagram.com/nauka.alleppey/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="Follow NAUKA on Instagram (@nauka.alleppey)"
          title="Instagram: @nauka.alleppey"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <a
          href="https://wa.me/919447724293"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="Chat with NAUKA on WhatsApp (+91 94477 24293)"
          title="WhatsApp: +91 94477 24293"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.81 13.47 3.81 11.91C3.81 7.37 7.5 3.67 12.05 3.67M9.11 7.27C8.95 7.27 8.69 7.33 8.46 7.58C8.24 7.83 7.6 8.43 7.6 9.64C7.6 10.86 8.49 12.03 8.61 12.2C8.74 12.36 10.36 14.86 12.84 15.93C13.43 16.19 13.88 16.34 14.24 16.45C14.83 16.64 15.37 16.61 15.8 16.55C16.28 16.48 17.27 15.95 17.48 15.37C17.68 14.78 17.68 14.28 17.62 14.18C17.56 14.07 17.41 14.01 17.18 13.9C16.95 13.78 15.82 13.23 15.61 13.15C15.4 13.07 15.25 13.03 15.1 13.26C14.94 13.48 14.51 14.01 14.38 14.16C14.25 14.31 14.13 14.33 13.9 14.21C13.67 14.1 12.73 13.79 11.61 12.79C10.74 12.01 10.15 11.05 9.98 10.76C9.81 10.47 9.96 10.31 10.08 10.2C10.18 10.1 10.31 9.93 10.42 9.8C10.54 9.67 10.58 9.57 10.66 9.41C10.74 9.25 10.7 9.11 10.64 9C10.58 8.89 10.12 7.76 9.93 7.3C9.74 6.85 9.55 6.91 9.41 6.91C9.28 6.9 9.11 6.9 8.95 6.9L9.11 7.27Z"/>
          </svg>
        </a>

        <a
          href="mailto:naukainsiders@gmail.com"
          class="social-link"
          aria-label="Send email to naukainsiders@gmail.com"
          title="Email: naukainsiders@gmail.com"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="3"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>
      </nav>

      <!-- Footer inside card -->
      <footer class="card__footer" role="contentinfo">
        <p>&copy; <span id="footer-year"></span> NAUKA</p>
      </footer>

    </section>
  </main>

  <!-- Supabase client (pinned version for predictable deployments) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="script.js"></script>
</body>
</html>
