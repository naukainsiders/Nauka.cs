<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nauka — Coming Soon</title>
<meta name="description" content="Nauka is coming soon. Stay tuned!">
<meta name="theme-color" content="#06382a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #06382a;   /* brand green from the logo */
    --cream:  #f7f0df;   /* tone 1: logo + "Coming soon" */
    --gold:   #f0c879;   /* tone 2: "stay tuned!" */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--forest);
    color: var(--cream);
    overflow: hidden;
  }

  /* ---------- Hero video ---------- */
  .hero { position: relative; height: 100%; width: 100%; }
  .hero video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* green-tinted veil: keeps the footage visible but guarantees contrast */
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(6,56,42,.62) 0%, rgba(6,56,42,.18) 40%, rgba(6,56,42,.18) 60%, rgba(6,56,42,.72) 100%);
    pointer-events: none;
  }

  /* ---------- Content ---------- */
  .content {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    text-align: center;
    padding: max(env(safe-area-inset-top), 0px) 24px max(env(safe-area-inset-bottom), 0px);
    padding-top: clamp(32px, 9vh, 96px);
    padding-bottom: clamp(36px, 10vh, 104px);
  }

  .logo {
    width: clamp(154px, 26.6vw, 364px); /* 70% of the previous size */
    height: auto;
    align-self: flex-start;             /* top-left instead of centered */
    margin-left: clamp(0px, 2vw, 32px);
    /* turns the dark-green logo cream so it reads over video.
       (Needs the transparent PNG — see note below.) */
    filter: brightness(0) invert(1) sepia(.18) saturate(1.4) drop-shadow(0 4px 24px rgba(0,0,0,.35));
    opacity: 0;
    animation: fade 1.8s ease-out .5s forwards;
  }

  .soon { opacity: 0; animation: fade 1.8s ease-out 2s forwards; }
  .soon .a {
    display: block;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: clamp(2.4rem, 6.4vw, 5rem);
    line-height: 1;
    color: var(--cream);
    text-shadow: 0 2px 20px rgba(0,0,0,.35);
  }
  .soon .b {
    display: block;
    margin-top: clamp(10px, 1.6vw, 18px);
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(.85rem, 1.7vw, 1.25rem);
    letter-spacing: .38em;
    text-transform: lowercase;
    color: var(--gold);
    text-shadow: 0 2px 14px rgba(0,0,0,.4);
  }

  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .logo, .soon { animation-duration: .01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
  <main class="hero">
    <video autoplay muted loop playsinline preload="auto"
           aria-hidden="true">
      <source src="https://res.cloudinary.com/dxmuistk4/video/upload/v1791743177/9656493-hd_1920_1080_24fps_de19dd.mp4" type="video/mp4">
    </video>

    <div class="content">
      <img class="logo"
           src="https://res.cloudinary.com/dxmuistk4/image/upload/v1791565882/nauka-logo-new_parqic.png"
           alt="Nauka">

      <p class="soon">
        <span class="a">Coming soon</span>
        <span class="b">stay tuned!</span>
      </p>
    </div>
  </main>
</body>
</html>
